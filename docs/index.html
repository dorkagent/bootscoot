<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BootScoot — line-dance stepsheet search</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;color:#222}
input,select,button{font-size:1rem;padding:.5rem;margin:.2rem}
#q{width:55%}
button{cursor:pointer}
.result{border-bottom:1px solid #ddd;padding:.6rem 0}
.result a{color:#1a56db;text-decoration:none}
.result a:hover{text-decoration:underline}
.meta{color:#666;font-size:.85rem}
code{background:#f4f4f4;padding:.1rem .3rem;font-size:.85rem}
.err{background:#fff3f3;border:1px solid #e88;padding:1rem;margin-top:1rem}
details{margin-top:2rem;color:#666;font-size:.85rem}
</style></head><body>
<h1>🤠 BootScoot</h1>
<p>Line-dance stepsheet search. Runs entirely in your browser — no server.</p>
<form id="f">
  <input id="q" placeholder="dance name…" value="Bailando" autocomplete="off">
  <select id="level">
    <option value="">any level</option><option>Beginner</option><option>High Beginner</option>
    <option>Improver</option><option>Intermediate</option><option>Advanced</option>
  </select>
  <button>Search</button>
</form>
<div id="out"></div>
<details><summary>Advanced</summary>
<p>Site: <input id="base" style="width:60%" value="https://www.copperknob.co.uk">
Max results: <input id="maxr" style="width:4rem" value="20"></p>
<p>Get the same results as JSON in your own scripts — see the
<a href="https://github.com/dorkagent/bootscoot">bootscoot repo</a> for the
Python, PowerShell and Node modules.</p>
</details>

<script>
// ---- search engine (adapted from bootscoot.js, browser build) ----
const NAMED_ENTITIES = {eacute:"é",egrave:"è",ecirc:"ê",euml:"ë",aacute:"á",agrave:"à",acirc:"â",auml:"ä",iacute:"í",igrave:"ì",icirc:"î",iiuml:"ï",oacute:"ó",ograve:"ò",ocirc:"ô",ouml:"ö",uacute:"ú",ugrave:"ù",ucirc:"û",uuml:"ü",ccedil:"ç",ntilde:"ñ",szlig:"ß",hellip:"…",mdash:"—",ndash:"–",laquo:"«",raquo:"»",copy:"©",reg:"®"};
const stripTags = (s) =>
  (s || "")
    .replace(/<\/?mark>/gi, "")
    .replace(/<[^>]+>/g, " ")
    .replace(/&nbsp;/g, " ")
    .replace(/&#(\d+);/g, (_, n) => String.fromCharCode(parseInt(n, 10)))
    .replace(/&#x([0-9a-fA-F]+);/g, (_, n) => String.fromCharCode(parseInt(n, 16)))
    .replace(/&([a-zA-Z]+);/g, (_, n) => {
      const v = NAMED_ENTITIES[n.toLowerCase()];
      if (!v) return `&${n};`;
      return n[0] === n[0].toUpperCase() ? v.toUpperCase() : v;
    })
    .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"')
    .replace(/&#39;|&apos;/g, "'").replace(/&amp;/g, "&")
    .replace(/\s+/g, " ").trim();

function parseResults(html, baseUrl) {
  const results = [];
  const blockRe = /<div class="listitem"[^>]*>([\s\S]*?)<\/div>\s*<\/div>/g;
  let m;
  while ((m = blockRe.exec(html)) !== null) {
    const block = m[1];
    const hrefM = block.match(/<a href="([^"]+)"/);
    if (!hrefM) continue;
    const idM = hrefM[1].match(/\/stepsheets\/([A-Za-z0-9]+)\//);
    if (!idM) continue;
    const titleM = block.match(/<span class="listTitleColor1">([\s\S]*?)<\/span>/);
    const cdM = block.match(/<span class="listTitleColor2">([\s\S]*?)<\/span>/);
    let choreographer = null, date = null;
    if (cdM) {
      const parts = stripTags(cdM[1]).split(/\s+-\s+/);
      choreographer = parts[0] || null;
      date = parts[1] || null;
    }
    let count = null, walls = null, level = null, music = null;
    const infoM = block.match(/<p class="listIcons">([\s\S]*?)<\/p>/);
    if (infoM) {
      const info = stripTags(infoM[1]);
      const cM = info.match(/(\d+)\s*Count/i);
      if (cM) count = parseInt(cM[1], 10);
      const wM = info.match(/(\d+|-)\s*Wall/i);
      if (wM && /^\d+$/.test(wM[1])) walls = parseInt(wM[1], 10);
      const muM = info.match(/Music:\s*(.+)$/i);
      if (muM) {
        music = muM[1].trim() || null;
        level = info.slice(0, muM.index)
          .replace(/(\d+)\s*Count/gi, "").replace(/(\d+|-)\s*Wall/gi, "")
          .replace(/^[\s-]+|[\s-]+$/g, "") || null;
      }
    }
    results.push({ id: idM[1], title: stripTags(titleM ? titleM[1] : "") || null,
      url: new URL(hrefM[1], baseUrl).href, choreographer, date, count, walls, level, music });
  }
  return results;
}

async function search(query, opts = {}) {
  const baseUrl = (opts.baseUrl || "").replace(/\/+$/, "");
  let maxResults = opts.maxResults || 20;
  if (!Number.isFinite(maxResults) || maxResults < 1) maxResults = 20;
  const q = { Order: "Date", Lang: "", Level: opts.level || "", Wall: "", Search: query };
  const results = [];
  let recnum = 0;
  for (let page = 0; page < 10; page++) {
    const params = new URLSearchParams(q);
    if (recnum > 0) params.set("recnum", String(recnum));
    const res = await fetch(`${baseUrl}/search?${params}`, { headers: { Accept: "text/html" } });
    if (!res.ok) throw new Error(`site returned HTTP ${res.status}`);
    const html = await res.text();
    const low = html.toLowerCase();
    if ((low.includes("challenges.cloudflare.com") || low.includes("just a moment")) && !low.includes("listitem"))
      throw new Error("the site is showing a bot challenge right now — try again later");
    const batch = parseResults(html, baseUrl);
    if (!batch.length) break;
    results.push(...batch);
    if (results.length >= maxResults) break;
    recnum += 20;
    await new Promise((r) => setTimeout(r, 1000));
  }
  return results.slice(0, maxResults);
}
// ---- ui ----
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const out = document.getElementById("out");
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  out.innerHTML = "<p>searching…</p>";
  try {
    const results = await search(q, {
      baseUrl: document.getElementById("base").value.trim(),
      level: document.getElementById("level").value,
      maxResults: parseInt(document.getElementById("maxr").value, 10),
    });
    out.innerHTML = results.map((x) =>
      '<div class="result"><a href="' + x.url + '" target="_blank" rel="noopener">' +
      (x.title || "?") + "</a>" +
      '<div class="meta">' + [x.choreographer, x.date,
        x.count != null ? x.count + "ct" : null,
        x.walls != null ? x.walls + "w" : null, x.level].filter(Boolean).join(" · ") + "</div>" +
      (x.music ? '<div class="meta">🎵 ' + x.music + "</div>" : "") + "</div>"
    ).join("") || "<p>no results</p>";
  } catch (err) {
    const cors = err instanceof TypeError;
    out.innerHTML = '<div class="err"><b>Search failed.</b> ' +
      (cors
        ? "Your browser blocked the request — the site needs to send an " +
          "<code>Access-Control-Allow-Origin</code> header on its search endpoint " +
          "for this page to reach it directly."
        : String((err && err.message) || err)) + "</div>";
  }
};
</script>
</body></html>
